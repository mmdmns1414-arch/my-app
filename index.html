<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منگل | فروشگاه</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#153e35;color:white;text-align:center;padding:24px 12px}
header h1{margin:0 0 8px;font-size:32px}
header p{margin:0;color:#d4e7df}
.top{max-width:1100px;margin:18px auto;padding:0 12px}
input,select,button{font-family:inherit;font-size:14px;padding:12px;border-radius:9px;border:1px solid #ddd}
input,select{width:100%;background:white}
button{border:0;background:#176c51;color:white;cursor:pointer}
button:hover{opacity:.85}
.search{margin-bottom:12px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.categories button{background:#e1eae6;color:#174b3c}
.categories button.active{background:#176c51;color:white}
h2{font-size:20px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:white;padding:15px;border-radius:13px;box-shadow:0 2px 8px #0000000b;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px;line-height:1.8;margin:0;overflow-wrap:anywhere}
.price{font-weight:bold;color:#16704e;font-size:16px}
.tag{font-size:12px;color:#777}
.empty{text-align:center;padding:30px;color:#777;grid-column:1/-1}
footer{text-align:center;padding:25px;color:#777;font-size:12px}
.admin-btn{display:block;margin:15px auto;background:#263b36}
.actions{display:flex;gap:6px}
.actions button{flex:1;padding:8px;font-size:12px}
.edit{background:#2467a0}
.delete{background:#b82f39}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;overflow:auto;padding:18px}
.box{background:white;border-radius:15px;max-width:520px;margin:25px auto;padding:20px}
.box h2{margin-top:0}
.form{display:grid;gap:10px}
.form button{padding:13px}
.cancel{background:#777}
.hidden{display:none!important}
.notice{font-size:12px;color:#666;line-height:1.8}
@media(max-width:400px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:11px}}
</style>
</head>
<body>

<header>
<h1>منگل</h1>
<p>فروشگاه منگل | جست‌وجو و مشاهده محصولات</p>
</header>

<main class="top">
<input id="search" class="search" placeholder="🔎 نام محصول را جست‌وجو کن...">

<div id="categories" class="categories"></div>

<h2 id="title">همه محصولات</h2>
<div id="products" class="products"></div>

<button class="admin-btn" onclick="openAdmin()">⚙️ مدیریت محصولات</button>
</main>

<footer>فروشگاه منگل</footer>

<div id="loginModal" class="modal">
<div class="box">
<h2>ورود به مدیریت</h2>
<form class="form" onsubmit="login(event)">
<input id="password" type="password" placeholder="رمز مدیریت" required>
<button type="submit">ورود</button>
<button type="button" class="cancel" onclick="closeModal('loginModal')">بازگشت</button>
<p class="notice">رمز پیش‌فرض: 123456</p>
</form>
</div>
</div>

<div id="adminModal" class="modal">
<div class="box">
<h2>مدیریت محصولات</h2>
<form id="productForm" class="form" onsubmit="saveProduct(event)">
<input id="productName" placeholder="نام محصول" required>
<input id="productPrice" type="number" min="0" placeholder="قیمت به تومان" required>
<select id="productCategory" required></select>
<button type="submit" id="saveBtn">افزودن محصول</button>
<button type="button" class="cancel" onclick="resetForm()">لغو ویرایش</button>
</form>
<hr>
<p class="notice">برای ویرایش یا حذف، از دکمه‌های زیر هر محصول استفاده کن.</p>
<button class="cancel" onclick="logout()">خروج از مدیریت</button>
<button class="cancel" onclick="closeModal('adminModal')">بستن</button>
</div>
</div>

function normalizeProduct(row,i){
return {id:10000+i,name:row[0],category:row[1],price:Number(row[2])};
}

let products=[];
try{
products=JSON.parse(localStorage.getItem("products")||"[]");
if(!Array.isArray(products)) products=[];
}catch(e){products=[];}

/* افزودن فهرست جدید فقط یک بار؛ محصولات قبلی حفظ می‌شوند */
if(!localStorage.getItem("mongel_products_seed_v1")){
const existingIds=new Set(products.map(p=>Number(p.id)));
const added=rawProducts.map(normalizeProduct).filter(p=>!existingIds.has(p.id));
products=products.concat(added);
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("mongel_products_seed_v1","1");
}

let selectedCategory="همه محصولات";
let admin=false;
let editingId=null;

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان";

function saveAll(){
localStorage.setItem("products",JSON.stringify(products));
}

function drawCategories(){
$("categories").innerHTML="";
categoriesList.forEach(c=>{
const b=document.createElement("button");
b.textContent=c;
if(c===selectedCategory)b.classList.add("active");
b.onclick=()=>{selectedCategory=c;drawCategories();drawProducts();};
$("categories").appendChild(b);
});
$("productCategory").innerHTML="";
categoriesList.filter(c=>c!=="همه محصولات").forEach(c=>{
const o=document.createElement("option");
o.value=c;o.textContent=c;
$("productCategory").appendChild(o);
});
}

function drawProducts(){
const q=$("search").value.trim().toLowerCase();
const list=products.filter(p=>
(selectedCategory==="همه محصولات"||p.category===selectedCategory)&&
String(p.name).toLowerCase().includes(q)
);
$("title").textContent=selectedCategory;
$("products").innerHTML="";
if(!list.length){
$("products").innerHTML='<div class="empty">محصولی پیدا نشد.</div>';
return;
}
list.forEach(p=>{
const card=document.createElement("article");
card.className="card";
const name=document.createElement("h3");
name.textContent=p.name;
const tag=document.createElement("div");
tag.className="tag";tag.textContent=p.category;
const price=document.createElement("div");
price.className="price";price.textContent=money(p.price);
card.append(name,tag,price);
if(admin){
const actions=document.createElement("div");
actions.className="actions";
const edit=document.createElement("button");
edit.className="edit";edit.textContent="ویرایش";
edit.onclick=()=>editProduct(p.id);
const del=document.createElement("button");
del.className="delete";del.textContent="حذف";
del.onclick=()=>deleteProduct(p.id);
actions.append(edit,del);card.appendChild(actions);
}
$("products").appendChild(card);
});
}

function openAdmin(){
if(admin){$("adminModal").style.display="block";}
else{$("loginModal").style.display="block";}
}
function closeModal(id){$(id).style.display="none";}
function login(e){
e.preventDefault();
if($("password").value==="123456"){
admin=true;$("password").value="";
closeModal("loginModal");
$("adminModal").style.display="block";
drawProducts();
}else alert("رمز اشتباه است.");
}
function logout(){
admin=false;resetForm();closeModal("adminModal");drawProducts();
}
function saveProduct(e){
e.preventDefault();
const name=$("productName").value.trim();
const price=Number($("productPrice").value);
const category=$("productCategory").value;
if(!name||!Number.isFinite(price)||price<0){
alert("نام و قیمت معتبر وارد کن.");return;
}
if(editingId!==null){
const p=products.find(p=>Number(p.id)===Number(editingId));
if(p){p.name=name;p.price=price;p.category=category;}
}else{
products.push({id:Date.now(),name,price,category});
}
saveAll();resetForm();drawProducts();
}
function editProduct(id){
const p=products.find(p=>Number(p.id)===Number(id));
if(!p)return;
editingId=id;
$("productName").value=p.name;
$("productPrice").value=p.price;
$("productCategory").value=p.category;
$("saveBtn").textContent="ذخیره تغییرات";
$("productName").scrollIntoView({behavior:"smooth",block:"center"});
}
function deleteProduct(id){
const p=products.find(p=>Number(p.id)===Number(id));
if(!p)return;
if(confirm("محصول «"+p.name+"» حذف شود؟")){
products=products.filter(x=>Number(x.id)!==Number(id));
saveAll();drawProducts();
}
}
function resetForm(){
editingId=null;
$("productForm").reset();
$("saveBtn").textContent="افزودن محصول";
}
$("search").addEventListener("input",drawProducts);
drawCategories();
drawProducts();
</script>

</html>
